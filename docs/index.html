<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shotacon</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"> -->
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sushantrahate/docsify-darkly-theme/css/darkly.min.css"> -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <!-- 侧边栏logo样式 -->
  <style>
    .app-name-link > img{
      width: 50%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Shotacon',
      repo: 'https://github.com/shotacon',
      loadSidebar: true,
      //自定义导航栏
      loadNavbar: true,
      // hideSidebar: true,
      homepage: 'index.md',
      logo: '/image/logo.png',
      subMaxLevel: 2,
      // alias: {
      //   '/.*/_sidebar.md': '/_sidebar.md'
      // },
      // 跳转后自动到顶部
      auto2top: true,
      // coverpage: true,

      // PLUGIN
      // 页面右侧toc
      toc: {
          tocMaxLevel: 2,
          target: "h2, h3, h4, h5, h6",
        },
      ga: 'trace_id'

      // 全文搜索
      // search: {
      //   depth: 6,
      //   noData: "没有搜到!",
      //   placeholder: "搜索...",
      //   // 避免搜索索引冲突,同一域下的多个网站之间
      //   namespace: "website-1",
      // }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- plugin -->
  <!-- 全文搜索 -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script> -->
  <!-- 页面右侧 TOC -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-toc@1.1.0/dist/docsify-plugin-toc.min.js"></script>
  <!-- 图片放大缩小 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- 代码复制 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <!-- Google分析-->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/ga.min.js"></script>
</body>
</html>
